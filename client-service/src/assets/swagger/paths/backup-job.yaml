/v1/backup-job/list:
  get:
    tags: [Backup Job]
    summary: List backup job runs (paginated, optionally filtered by config)
    security: [{ cookieAuth: [] }]
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/backup-job/:
  get:
    tags: [Backup Job]
    summary: Get a single backup job by id
    security: [{ cookieAuth: [] }]
    parameters:
      - name: id
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'

/v1/backup-job/resume:
  get:
    tags: [Backup Job]
    summary: Resume a previously interrupted backup job
    security: [{ cookieAuth: [] }]
    parameters:
      - name: id
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
