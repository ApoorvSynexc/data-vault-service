/v1/archival-config/object-records:
  post:
    tags: [Archival Config]
    summary: Preview records matching an archival configuration's object filters
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, description: Salesforce object API name }
              fieldNames: { type: array, items: { type: string } }
              soql: { type: string, description: Optional SOQL filter condition }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/list:
  get:
    tags: [Archival Config]
    summary: List archival configurations (paginated)
    security: [{ cookieAuth: [] }]
    parameters:
      - name: pagination
        in: query
        schema: { type: string, enum: ['true', 'false'] }
        description: Set to "true" to page through results instead of returning up to 1000 unpaginated
      - name: limit
        in: query
        schema: { type: integer, default: 10 }
      - name: cursor
        in: query
        schema: { type: string }
      - name: name
        in: query
        schema: { type: string }
      - name: destinationId
        in: query
        schema: { type: string }
      - name: search
        in: query
        schema: { type: string }
      - name: status
        in: query
        schema: { type: string }
      - name: backupStatus
        in: query
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/:
  get:
    tags: [Archival Config]
    summary: Get a single archival configuration by slug
    security: [{ cookieAuth: [] }]
    parameters:
      - name: slug
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
  put:
    tags: [Archival Config]
    summary: Update an archival configuration
    description: >
      Not validated by Joi — accepts a partial subset of the create-time fields
      below (any combination), applied as-is to the stored config.
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              crmId: { type: string }
              destinationId: { type: string }
              name: { type: string }
              description: { type: string }
              objectNames: { type: array, items: { type: string }, minItems: 1 }
              schedule: { type: string, enum: [SCHEDULE] }
              scheduleConfig: { type: object, description: 'See POST / for shape (type, timeZone, scheduling)' }
              objects: { type: array, items: { type: object }, description: Per-object type/condition/field/children tree }
              status: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
  delete:
    tags: [Archival Config]
    summary: Delete an archival configuration
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
  post:
    tags: [Archival Config]
    summary: Create an archival configuration (Hudi-only, richer object/field/SOQL support)
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [crmId, destinationId, objectNames, schedule]
            properties:
              crmId: { type: string }
              destinationId: { type: string }
              name: { type: string }
              description: { type: string }
              objectNames: { type: array, items: { type: string }, minItems: 1 }
              schedule: { type: string, enum: [SCHEDULE], description: Archival only supports the SCHEDULE mode, not REALTIME }
              scheduleConfig:
                type: object
                description: Optional even though schedule is always SCHEDULE
                required: [type, timeZone]
                properties:
                  type: { type: string, description: 'e.g. ONE_TIME, INCREMENTAL' }
                  timeZone: { type: string }
                  scheduling:
                    type: object
                    description: frequency, interval, and the fields that frequency requires (weekDays, monthDate/selectedMonths, startDate/endDate, startTime)
              objects:
                type: array
                description: Per-object { id, name, type, field[], condition?, children? } cascade tree
                items: { type: object }
              status: { type: string, description: 'e.g. ACTIVE, DRAFT' }
    responses:
      201:
        $ref: '#/components/responses/Created'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/stats:
  get:
    tags: [Archival Config]
    summary: Get archival job success/failure stats
    description: >
      slug is optional — when omitted, stats are aggregated across every
      archival configuration owned by the authenticated user.
    security: [{ cookieAuth: [] }]
    parameters:
      - name: slug
        in: query
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/run-now:
  get:
    tags: [Archival Config]
    summary: Trigger an out-of-schedule archival run for a configuration
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/dry-run:
  post:
    tags: [Archival Config]
    summary: Get record counts an archival configuration would touch (read-only)
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [crmId, objects]
            properties:
              crmId: { type: string }
              objects:
                type: array
                description: Per-object { id, name, type, field[], condition?, children? } cascade tree
                items: { type: object }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/validate-soql:
  post:
    tags: [Archival Config]
    summary: Validate a custom SOQL filter used by an archival configuration
    description: >
      Child objects cannot carry their own filter condition (isParent: false
      with a condition/field present returns isValid: false rather than a 400).
      An object with no condition at all is trivially valid (nothing to check
      against Salesforce).
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [crmId, object, isParent]
            properties:
              crmId: { type: string }
              isParent: { type: boolean }
              object:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  condition:
                    type: object
                    properties:
                      type: { type: string, description: Condition type, e.g. CUSTOM/SOQL }
                      expression: { type: string, description: Required when type is CUSTOM }
                      soqlQuery: { type: string, description: Required when type is SOQL }
                  field:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        dataType: { type: string }
                        filter:
                          type: object
                          properties:
                            operator: { type: string }
                            value: {}
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/salesforce/preview:
  post:
    tags: [Archival Config]
    summary: Search archived records for an object across its archival configurations
    description: >
      No session auth — identifies the org by orgId/organizationId in the body instead
      (resolved to its CRM/archival configs internally). Only orgId and objName are
      required; fields, startDate/endDate, filters, dateFilters, limit, page/cursor are
      all optional. Prefer cursor (the previous response's nextCursor) over page for
      paging — it fetches the next rows directly instead of skipping earlier ones.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [orgId, objName]
            properties:
              orgId: { type: string }
              organizationId: { type: string, description: Alias for orgId }
              objName: { type: string }
              fields: { type: array, items: { type: string } }
              startDate: { type: string, format: date-time }
              endDate: { type: string, format: date-time }
              filters: { type: object }
              dateFilters: { type: object }
              limit: { type: integer }
              page: { type: integer, default: 1 }
              cursor: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      404:
        $ref: '#/components/responses/NotFound'

/v1/archival-config/salesforce/record-detail:
  post:
    tags: [Archival Config]
    summary: Get one archived record's full detail, plus its related child objects
    description: >
      No session auth — same orgId-in-body trust boundary as /salesforce/preview.
      recordId (or Id/id) is required in addition to orgId/objName. includeRelated
      defaults to true; pass false to skip listing child objects.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [orgId, objName, recordId]
            properties:
              orgId: { type: string }
              organizationId: { type: string, description: Alias for orgId }
              objName: { type: string }
              recordId: { type: string }
              fields: { type: array, items: { type: string } }
              filters: { type: object }
              dateFilters: { type: object }
              includeRelated: { type: boolean, default: true }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
