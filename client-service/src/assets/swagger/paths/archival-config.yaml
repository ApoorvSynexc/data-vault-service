/v1/archival-config/object-records:
  post:
    tags: [Archival Config]
    summary: Preview records matching an archival configuration's object filters
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/list:
  get:
    tags: [Archival Config]
    summary: List archival configurations (paginated)
    security: [{ cookieAuth: [] }]
    parameters:
      - name: pagination
        in: query
        schema: { type: string, enum: ['true', 'false'] }
        description: Set to "true" to page through results instead of returning up to 1000 unpaginated
      - name: limit
        in: query
        schema: { type: integer, default: 10 }
      - name: cursor
        in: query
        schema: { type: string }
      - name: name
        in: query
        schema: { type: string }
      - name: destinationId
        in: query
        schema: { type: string }
      - name: search
        in: query
        schema: { type: string }
      - name: status
        in: query
        schema: { type: string }
      - name: backupStatus
        in: query
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/:
  get:
    tags: [Archival Config]
    summary: Get a single archival configuration by slug
    security: [{ cookieAuth: [] }]
    parameters:
      - name: slug
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
  put:
    tags: [Archival Config]
    summary: Update an archival configuration
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
  delete:
    tags: [Archival Config]
    summary: Delete an archival configuration
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
  post:
    tags: [Archival Config]
    summary: Create an archival configuration (Hudi-only, richer object/field/SOQL support)
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      201:
        $ref: '#/components/responses/Created'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/stats:
  get:
    tags: [Archival Config]
    summary: Get archival job success/failure stats
    description: >
      slug is optional — when omitted, stats are aggregated across every
      archival configuration owned by the authenticated user.
    security: [{ cookieAuth: [] }]
    parameters:
      - name: slug
        in: query
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/run-now:
  get:
    tags: [Archival Config]
    summary: Trigger an out-of-schedule archival run for a configuration
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/dry-run:
  post:
    tags: [Archival Config]
    summary: Get record counts an archival configuration would touch (read-only)
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/validate-soql:
  post:
    tags: [Archival Config]
    summary: Validate a custom SOQL filter used by an archival configuration
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [soql]
            properties:
              soql: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/archival-config/salesforce/preview:
  post:
    tags: [Archival Config]
    summary: Search archived records for an object across its archival configurations
    description: >
      No session auth — identifies the org by orgId/organizationId in the body instead
      (resolved to its CRM/archival configs internally). Only orgId and objName are
      required; fields, startDate/endDate, filters, dateFilters, limit, page/cursor are
      all optional. Prefer cursor (the previous response's nextCursor) over page for
      paging — it fetches the next rows directly instead of skipping earlier ones.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [orgId, objName]
            properties:
              orgId: { type: string }
              organizationId: { type: string, description: Alias for orgId }
              objName: { type: string }
              fields: { type: array, items: { type: string } }
              startDate: { type: string, format: date-time }
              endDate: { type: string, format: date-time }
              filters: { type: object }
              dateFilters: { type: object }
              limit: { type: integer }
              page: { type: integer, default: 1 }
              cursor: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      404:
        $ref: '#/components/responses/NotFound'

/v1/archival-config/salesforce/record-detail:
  post:
    tags: [Archival Config]
    summary: Get one archived record's full detail, plus its related child objects
    description: >
      No session auth — same orgId-in-body trust boundary as /salesforce/preview.
      recordId (or Id/id) is required in addition to orgId/objName. includeRelated
      defaults to true; pass false to skip listing child objects.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [orgId, objName, recordId]
            properties:
              orgId: { type: string }
              organizationId: { type: string, description: Alias for orgId }
              objName: { type: string }
              recordId: { type: string }
              fields: { type: array, items: { type: string } }
              filters: { type: object }
              dateFilters: { type: object }
              includeRelated: { type: boolean, default: true }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
