/v1/crm/list:
  get:
    tags: [CRM]
    summary: List CRM accounts connected to the authenticated user's organization
    security: [{ cookieAuth: [] }]
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/crm/:
  put:
    tags: [CRM]
    summary: Update a connected CRM account
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [crmId]
            properties:
              crmId: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
  delete:
    tags: [CRM]
    summary: Delete a connected CRM account record
    security: [{ cookieAuth: [] }]
    parameters:
      - name: crmId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'

/v1/crm/connect:
  get:
    tags: [CRM]
    summary: Start the Salesforce OAuth connect flow (redirects to Salesforce)
    security: [{ cookieAuth: [] }]
    parameters:
      - name: crmName
        in: query
        schema: { type: string }
        description: Defaults to "salesforce" when omitted; either crmName or userId is required
      - name: userId
        in: query
        schema: { type: string }
      - name: environment
        in: query
        schema: { type: string, enum: [production, sandbox, custom] }
        default: production
      - name: name
        in: query
        schema: { type: string }
        description: Optional display name persisted on the OAuth state
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'

/v1/crm/callback:
  get:
    tags: [CRM]
    summary: Salesforce OAuth callback that finalizes the CRM connection
    security: [{ cookieAuth: [] }]
    parameters:
      - name: code
        in: query
        required: true
        schema: { type: string }
      - name: state
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'

/v1/crm/disconnect:
  delete:
    tags: [CRM]
    summary: Disconnect a CRM account without deleting its record
    security: [{ cookieAuth: [] }]
    parameters:
      - name: userId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
