/v1/public/payload:
  post:
    tags: [Public]
    summary: Decrypt an encrypted transport payload and kick off the EMR payload-transform job
    description: >
      No session auth — the trust boundary is the decrypt step itself. Called by an
      S3/EventBridge-adjacent caller holding the shared transport key.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [payload]
            properties:
              payload:
                type: string
                description: Base64 encrypted envelope containing backupConfigId
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'

/v1/public/backup-trigger:
  post:
    tags: [Public]
    summary: EventBridge scheduled-rule target for maintenance/backup/archival/restore triggers
    description: >
      Gated by an X-Api-Key header matching AWS_EVENT_DESTINATION_API_KEY, not session
      auth — 401s otherwise. detail.purpose selects the branch: DAILY_MAINTENANCE (one
      or more of isSyncSalesforceRefreshToken/isLogsArchive/isStaleObjects/isSyncPayment/
      isSyncObject/isRetryBackupFailedJob), RUN_EMR, or BACKUP_JOB (default) keyed by
      detail.backupConfigId/userId/id.
    security: []
    parameters:
      - name: X-Api-Key
        in: header
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: EventBridge envelope with a detail object (see description for its shape)
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/public/test:
  post:
    tags: [Public]
    summary: No-op diagnostic endpoint
    description: Internal scratch endpoint with no request body; always returns success.
    security: []
    responses:
      200:
        $ref: '#/components/responses/Success'

/v1/public/webhook/salesforce:
  put:
    tags: [Public]
    summary: Salesforce real-time change-event webhook (Data Vault managed package Apex trigger)
    description: >
      Body arrives as an encrypted two-layer Salesforce envelope; decryption via the
      attachDecryptedSalesforceRequest middleware is the sole authorization check.
      Responds 200 immediately, then fans out to backup-service per matching
      real-time backup config.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [cipherText, iv, authTag]
            properties:
              cipherText: { type: string }
              iv: { type: string }
              authTag: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
