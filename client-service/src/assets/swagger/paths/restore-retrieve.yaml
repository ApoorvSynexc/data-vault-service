/v1/restore/:
  post:
    tags: [Restore Retrieve]
    summary: Create a restore job
    description: >
      status: 'DRAFT' creates the restore without triggering anything further;
      any other value (or omitted) immediately kicks off metadata comparison and,
      for a REALTIME NORMAL config, a schema-sync backup job before the restore's
      own field setup/transform proceeds.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [source]
            properties:
              status: { type: string, enum: [DRAFT], description: Omit for a normal (non-draft) restore }
              source:
                type: object
                required: [backupConfigId]
                properties:
                  backupConfigId: { type: string }
                  configType: { type: string, enum: [BACKUP, ARCHIVAL] }
                  type: { type: string, enum: [ENTIRE, PARTIAL, CHANGED_BETWEEN, DELETED_BETWEEN] }
                  startDate: { type: string, format: date-time }
                  endDate: { type: string, format: date-time }
              selection:
                type: object
                properties:
                  restoreScope:
                    type: object
                    description: 'type: ALL|OBJECT|RECORD|FIELD|FILTER|DELETED_ONLY|INSERTS_ONLY|CHANGE_SINCE|BULK_CSV|OBJECT_TREE, plus the matching objects/records/fields/filters/changeSince/bulkCsvIds array for that type'
                    properties:
                      type: { type: string }
              destination:
                type: object
                properties:
                  type: { type: string, enum: [SAME, DIFFERENT] }
                  crmId: { type: string }
                  tagRestoredRecord: { type: string }
              conflict:
                type: object
                properties:
                  restoreMode: { type: string, enum: [OVERWRITE, APPEND_NEW, REPLACE_ENTIRE_OBJECT, SKIP] }
                  edgeCases: { type: object, description: onDuplicateRecord/missingFieldInDestination/ownerInactive/parentMissing/recordTypeMissing/missingRequiredFieldValue/includeChilds/includeAuditFields }
                  mergeRule: { type: object, description: 'default: NEWEST_LAST_MODIFIED_DATE_WINS|SOURCE_ALWAYS_WINS|DESTINATION_ALWAYS_WINS, plus per-object/field overrides' }
              jobDetail:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string }
                  tags: { type: array, items: { type: string } }
              schedule: { type: object }
    responses:
      201:
        $ref: '#/components/responses/Created'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/bulk-csv/upload:
  post:
    tags: [Restore Retrieve]
    summary: Upload a CSV of record Ids for use as a restore's bulkCsvIds scope
    description: >
      Multipart upload (field "file", plus "objectName" and "backupConfigId" fields).
      Uploads the CSV to the config's destination S3 and returns { objectName, ids, s3Key }
      for use as one entry of selection.restoreScope.bulkCsvIds when creating a restore.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, objectName, backupConfigId]
            properties:
              file: { type: string, format: binary }
              objectName: { type: string }
              backupConfigId: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/config/list:
  get:
    tags: [Restore Retrieve]
    summary: List restore/retrieve jobs, paginated by config or user
    security: [{ cookieAuth: [] }]
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/job:
  get:
    tags: [Restore Retrieve]
    summary: Get a single restore job by restoreId
    security: [{ cookieAuth: [] }]
    parameters:
      - name: restoreId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'

/v1/restore/job/rollback:
  put:
    tags: [Restore Retrieve]
    summary: Roll back a completed restore job
    security: [{ cookieAuth: [] }]
    parameters:
      - name: restoreJobId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/job/stats:
  get:
    tags: [Restore Retrieve]
    summary: Get restore job success/failure stats
    description: >
      restoreId is optional — when omitted, stats are aggregated across every
      restore job owned by the authenticated user.
    security: [{ cookieAuth: [] }]
    parameters:
      - name: restoreId
        in: query
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/get-objectlist-by-configid:
  get:
    tags: [Restore Retrieve]
    summary: List the object(s) selected on a single backup configuration, narrowed to what a restore can write back
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
      - name: configType
        in: query
        required: true
        schema: { type: string, enum: [BACKUP, ARCHIVAL] }
        description: Validated against the config's stored type to prevent cross-type access
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/retrieve/fetch-records:
  post:
    tags: [Restore Retrieve]
    summary: Fetch one object's records out of the compressed Hudi/Delta tables
    description: >
      ENTIRE, or CHANGED_BETWEEN a date window; each row is tagged with the
      OPERATION a restore would perform.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [backupConfigId, configType, objectApiName, type, columnNames]
            properties:
              backupConfigId: { type: string }
              configType: { type: string, enum: [BACKUP, ARCHIVAL] }
              objectApiName: { type: string }
              type: { type: string, enum: [ENTIRE, CHANGED_BETWEEN] }
              startDate: { type: string, format: date-time, description: Required for CHANGED_BETWEEN }
              endDate: { type: string, format: date-time, description: Required for CHANGED_BETWEEN }
              columnNames: { type: array, items: { type: string } }
              searchText: { type: string }
              cursor: { type: string, description: Opaque nextCursor echoed back from a previous response }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/retrieve/fetch-missing-fields:
  post:
    tags: [Restore Retrieve]
    summary: Fields the backup config's stored S3 schema has that live Salesforce fields do not
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [backupConfigId, objectApiName, configType]
            properties:
              backupConfigId: { type: string }
              objectApiName: { type: string }
              configType: { type: string, enum: [BACKUP, ARCHIVAL] }
              startDate: { type: string, format: date-time }
              endDate: { type: string, format: date-time }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/retrieve/fetch-missing-record-types:
  post:
    tags: [Restore Retrieve]
    summary: Record types flagged inactive/deleted by backup history and still missing/inactive on the destination org
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [backupConfigId, configType]
            properties:
              backupConfigId: { type: string }
              configType: { type: string, enum: [BACKUP, ARCHIVAL] }
              objectApiNames: { type: array, items: { type: string }, description: Omit to resolve every restorable object on the config }
              startDate: { type: string, format: date-time }
              endDate: { type: string, format: date-time }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/retrieve/required-fields:
  post:
    tags: [Restore Retrieve]
    summary: Get an object's required fields after restore field filtering
    description: Restore-writable, non-system, required-on-create fields.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [backupConfigId, objectApiName]
            properties:
              backupConfigId: { type: string }
              objectApiName: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/retrieve/validate-query:
  post:
    tags: [Restore Retrieve]
    summary: Validate one object's SOQL FILTER condition against its compressed Hudi table
    description: >
      Converts the SOQL to an Athena WHERE clause and runs it (LIMIT 1) against the
      object's real compressed data. Response: { matched: boolean, valid: true } — valid
      confirms the query itself ran successfully, independent of whether matched is true
      or false.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [backupConfigId, configType, objectApiName, soqlQuery]
            properties:
              backupConfigId: { type: string }
              configType: { type: string, enum: [BACKUP, ARCHIVAL] }
              objectApiName: { type: string }
              soqlQuery: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/fetch-object-fields:
  get:
    tags: [Restore Retrieve]
    summary: Get the latest S3 schema for an object on a backup configuration
    security: [{ cookieAuth: [] }]
    parameters:
      - name: objectApiName
        in: query
        required: true
        schema: { type: string }
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/dry-run:
  post:
    tags: [Restore Retrieve]
    summary: Get record counts a restore configuration would touch (read-only)
    description: >
      ENTIRE returns main Hudi-only counts; CHANGED_BETWEEN returns delta
      total/UPDATE/DELETE counts. selection.restoreScope.type supports ALL,
      OBJECT, FIELD, FILTER, RECORD, BULK_CSV, DELETED_ONLY (DELETED_ONLY only
      under CHANGED_BETWEEN). ARCHIVAL configs only support source.type
      ENTIRE — they have no delta table. No restore is performed.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DryRunRequest'
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/dry-run-diff:
  post:
    tags: [Restore Retrieve]
    summary: Same as dry-run, but returns the records themselves paired with the destination org's current version
    description: >
      Each result pairs {changeRecord, salesforceRecord}, capped per object.
      ARCHIVAL configs only support source.type ENTIRE, same as /dry-run —
      CHANGED_BETWEEN 400s with archival_dry_run_diff_entire_only.
      Read-only, no restore is performed.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/DryRunRequest'
              - type: object
                properties:
                  limit: { type: integer, default: 20, maximum: 20, description: Records per object }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/get-picklist-field-values:
  get:
    tags: [Restore Retrieve]
    summary: Get picklist values for a field, used to populate restore filter UI
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
      - name: objectApiName
        in: query
        required: true
        schema: { type: string }
      - name: fieldApiName
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/restore/download-csv:
  get:
    tags: [Restore Retrieve]
    summary: Get presigned S3 download URLs for a completed restore job's exported CSV(s)
    description: One presigned URL per part, for the given object of a SUCCESS-status restore job.
    security: [{ cookieAuth: [] }]
    parameters:
      - name: restoreJobId
        in: query
        required: true
        schema: { type: string }
      - name: objectName
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
