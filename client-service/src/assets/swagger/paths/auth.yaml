/v1/auth/signup:
  post:
    tags: [Auth]
    summary: Create a new user account
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [firstName, contact, authProvider]
            properties:
              firstName: { type: string }
              lastName: { type: string }
              contact:
                type: object
                required: [email]
                properties:
                  email: { type: string, format: email }
              password: { type: string, format: password }
              authProvider: { type: string }
              gender: { type: string }
    responses:
      201:
        $ref: '#/components/responses/Created'
      400:
        $ref: '#/components/responses/BadRequest'

/v1/auth/login:
  post:
    tags: [Auth]
    summary: Log in and receive the accessToken/refreshToken session cookies
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string, format: password }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'

/v1/auth/refresh-token:
  post:
    tags: [Auth]
    summary: Exchange the refreshToken cookie for a new accessToken
    security: []
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/auth/logout:
  post:
    tags: [Auth]
    summary: Clear the session cookies and invalidate the session
    security: []
    responses:
      200:
        $ref: '#/components/responses/Success'

/v1/auth/social-login:
  get:
    tags: [Auth]
    summary: Start the social login OAuth flow (redirects to the provider)
    security: []
    responses:
      200:
        $ref: '#/components/responses/Success'

/v1/auth/social-login/callback:
  get:
    tags: [Auth]
    summary: OAuth callback that completes social login and sets the session cookies
    security: []
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'

/v1/auth/configure-org:
  post:
    tags: [Auth]
    summary: Registers a Salesforce org's encryption/API keys, then builds that org's admin authorization URL
    description: >
      Body IS the encrypted envelope (bootstrap SALESFORCE_ENCRYPTION_KEY, single
      layer — there's no org key yet, since registering the org is what produces
      one), decrypting to { type: 'org', org_details: { orgId, instanceUrl,
      environment? }, user_details: { user_id, org_id, user_email, user_username,
      user_first_name, user_last_name, instance_url, org_environment?,
      permission_set_name } }. Response's data is itself an encrypted envelope
      (same bootstrap key), decrypting to { org: { encryptionKey, apiKey }, user:
      <nested envelope, encrypted with the org's own key, decrypting to
      { authorizationUrl } > }. A malformed envelope (missing cipherText/iv/
      authTag) 400s via authorizeOrganizationValidation before decryption is
      even attempted; a validly-shaped envelope that fails to decrypt 401s.
    security: []
    requestBody:
      $ref: '#/components/requestBodies/SalesforceEnvelopeBody'
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
