/v1/destination/:
  post:
    tags: [Destination]
    summary: Create a backup destination (e.g. S3 bucket)
    description: >
      For provider AWS, type must be S3 and config is validated against AWS
      (validateS3Credentials) before the destination is created — invalid
      credentials 400 with invalid_aws_credentials. Pass is_already_granted:
      true if the Athena bucket-policy grant was already applied manually
      (verified, not just trusted); otherwise it's granted automatically.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, provider, type, config]
            properties:
              name: { type: string }
              provider: { type: string, enum: [AWS, AZURE, GCP] }
              type: { type: string, description: Required to be S3 when provider is AWS; any string otherwise }
              config:
                type: object
                description: Required shape when provider is AWS; an arbitrary object for AZURE/GCP
                properties:
                  bucketName: { type: string }
                  region: { type: string }
                  accessKeyId: { type: string }
                  secretAccessKey: { type: string }
                  folderPath: { type: string }
              is_already_granted: { type: boolean }
    responses:
      201:
        $ref: '#/components/responses/Created'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
  get:
    tags: [Destination]
    summary: Get a single destination by id
    security: [{ cookieAuth: [] }]
    parameters:
      - name: destinationId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
  put:
    tags: [Destination]
    summary: Update a destination
    description: At least one field required; every field is optional on its own.
    security: [{ cookieAuth: [] }]
    parameters:
      - name: destinationId
        in: query
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name: { type: string }
              provider: { type: string, enum: [AWS, AZURE, GCP] }
              type: { type: string }
              config:
                type: object
                properties:
                  bucketName: { type: string }
                  region: { type: string }
                  accessKeyId: { type: string }
                  secretAccessKey: { type: string }
                  folderPath: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
  delete:
    tags: [Destination]
    summary: Delete a destination
    security: [{ cookieAuth: [] }]
    parameters:
      - name: destinationId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/destination/list:
  get:
    tags: [Destination]
    summary: List destinations (paginated)
    security: [{ cookieAuth: [] }]
    parameters:
      - name: limit
        in: query
        schema: { type: integer, default: 20 }
      - name: cursor
        in: query
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/destination/config:
  get:
    tags: [Destination]
    summary: Get the raw config (e.g. bucket/region) of a destination
    security: [{ cookieAuth: [] }]
    parameters:
      - name: destinationId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
