/v1/backup-config/:
  post:
    tags: [Backup Config]
    summary: Create a backup configuration and schedule its recurring run
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      201:
        $ref: '#/components/responses/Created'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
  get:
    tags: [Backup Config]
    summary: Get a single backup configuration by slug
    security: [{ cookieAuth: [] }]
    parameters:
      - name: slug
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
  put:
    tags: [Backup Config]
    summary: Update a backup configuration
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
  delete:
    tags: [Backup Config]
    summary: Delete a backup configuration
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'

/v1/backup-config/list:
  get:
    tags: [Backup Config]
    summary: List backup configurations (paginated)
    security: [{ cookieAuth: [] }]
    parameters:
      - name: pagination
        in: query
        schema: { type: string, enum: ['true', 'false'] }
        description: Set to "true" to page through results instead of returning up to 1000 unpaginated
      - name: limit
        in: query
        schema: { type: integer, default: 10 }
      - name: cursor
        in: query
        schema: { type: string }
      - name: search
        in: query
        schema: { type: string }
      - name: status
        in: query
        schema: { type: string }
      - name: backupStatus
        in: query
        schema: { type: string }
      - name: schedule
        in: query
        schema: { type: string }
      - name: destinationId
        in: query
        schema: { type: string }
      - name: withoutLastBackupAt
        in: query
        schema: { type: string, enum: ['true', 'false'] }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/backup-config/run-now:
  get:
    tags: [Backup Config]
    summary: Trigger an out-of-schedule backup run for a configuration
    security: [{ cookieAuth: [] }]
    parameters:
      - name: backupConfigId
        in: query
        required: true
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/backup-config/stats:
  get:
    tags: [Backup Config]
    summary: Get backup job success/failure stats
    description: >
      slug is optional — when omitted, stats are aggregated across every
      backup configuration owned by the authenticated user.
    security: [{ cookieAuth: [] }]
    parameters:
      - name: slug
        in: query
        schema: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/backup-config/initalize-payload-transform:
  get:
    tags: [Backup Config]
    summary: Initialize the payload transform used to build a backup run's job payload
    security: [{ cookieAuth: [] }]
    parameters:
      - name: slug
        in: query
        required: true
        schema: { type: string }
    responses:
      201:
        $ref: '#/components/responses/Created'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/backup-config/sync-metadata:
  get:
    tags: [Backup Config]
    summary: Trigger a metadata sync for a backup configuration's objects
    security: [{ cookieAuth: [] }]
    parameters:
      - name: slug
        in: query
        required: true
        schema: { type: string }
    responses:
      201:
        $ref: '#/components/responses/Created'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/backup-config/trigger/recover:
  post:
    tags: [Backup Config]
    summary: Recover/retry a backup configuration's failed scheduled trigger
    description: >
      Called once the client has prompted the user for a record Id of objectApiName,
      so the Apex Trigger + Test Class recovery can build around a real record.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [backupConfigId, objectApiName, recordId]
            properties:
              backupConfigId: { type: string }
              objectApiName: { type: string }
              recordId: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
