/v1/user/my-profile:
  get:
    tags: [User]
    summary: Get the authenticated user's profile
    security: [{ cookieAuth: [] }]
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
  put:
    tags: [User]
    summary: Update the authenticated user's profile
    description: At least one field required; every field is optional on its own.
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              firstName: { type: string }
              lastName: { type: string }
              gender: { type: string }
    responses:
      200:
        $ref: '#/components/responses/Success'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/user/default-permissions:
  get:
    tags: [User]
    summary: Get the default permission set assigned to new roles
    security: [{ cookieAuth: [] }]
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'

/v1/user/logout:
  get:
    tags: [User]
    summary: Log out the authenticated user (clears the session)
    security: [{ cookieAuth: [] }]
    responses:
      200:
        $ref: '#/components/responses/Success'
      401:
        $ref: '#/components/responses/Unauthorized'
