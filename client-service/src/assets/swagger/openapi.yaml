openapi: 3.0.3
info:
  title: DataVault Client Service API
  description: >
    REST API served by client-service. Every endpoint responds with the envelope
    `{ success, message, data, meta }`. Session auth is a JWT stored in the
    `accessToken` HttpOnly cookie set by POST /v1/auth/login.
  # version is stamped in at load time from package.json, see src/config/swagger/index.ts
servers:
  - url: /api
    description: Same-origin, relative to the host serving this app

tags:
  - name: Health
    description: Liveness check
  - name: Auth
    description: Signup, login, session refresh, social login, org authorization — public
  - name: User
    description: Authenticated user profile and org user management
  - name: CRM
    description: Connected CRM (Salesforce) account lifecycle
  - name: CRM Metadata
    description: Read-only Salesforce object/field/record-type metadata
  - name: Backup Config
    description: Backup configuration CRUD, scheduling and metadata sync
  - name: Backup Job
    description: Backup job run history and manual retry
  - name: Internal
    description: Server-to-server routes called by backup-service (X-Internal-Secret)
  - name: Public
    description: Unauthenticated routes gated by an encrypted payload / signed webhook instead
  - name: Archival Config
    description: Archival configuration CRUD, dry-run and SOQL validation
  - name: Dashboard
    description: Aggregated overview widgets
  - name: Destination
    description: Backup destination (e.g. S3 bucket) CRUD
  - name: Restore Retrieve
    description: Restore/retrieve job creation, browsing and record-level diffing
  - name: Salesforce
    description: Salesforce org user/role/permission management
  - name: Settings
    description: Per-organization settings
  - name: Spark Job
    description: EMR/Spark job payload build and status callbacks
  - name: Storage
    description: Storage usage overview
  - name: Notification
    description: In-app notifications

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: JWT set as an HttpOnly cookie on login. Required by every private route.
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: Shared secret used for server-to-server calls (e.g. from backup-service).
    sparkApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Shared secret used by the EMR Spark job's callback routes (SPARK_JOB_API_KEY).

  parameters:
    SalesforceOrgIdHeader:
      name: X-DataCraft-Org-Id
      in: header
      required: true
      schema: { type: string }
      description: Salesforce organization id, used to look up the org's registered CRM/encryption key.
    SalesforceApiKeyHeader:
      name: X-Api-Key
      in: header
      required: true
      schema: { type: string }
      description: Per-org API key issued at /v1/auth/configure-org time, checked against crm.apiKey.
    SalesforceEnvelopeQuery:
      name: envelope
      in: query
      required: true
      schema: { type: string }
      description: JSON-stringified { cipherText, iv, authTag }, encrypted with the org's own key.

  requestBodies:
    SalesforceEnvelopeBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedEnvelope'

  schemas:
    ApiResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        meta:
          type: object
    DryRunRequest:
      type: object
      required: [backupConfigId, configType, source, selection]
      properties:
        backupConfigId: { type: string }
        configType: { type: string, enum: [BACKUP, ARCHIVAL] }
        source:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [ENTIRE, CHANGED_BETWEEN] }
            startDate: { type: string, format: date-time, description: Required when type is CHANGED_BETWEEN }
            endDate: { type: string, format: date-time, description: Required when type is CHANGED_BETWEEN }
        selection:
          type: object
          required: [restoreScope]
          properties:
            restoreScope:
              type: object
              required: [type]
              description: >
                type: ALL|OBJECT|FIELD|FILTER|RECORD|BULK_CSV|DELETED_ONLY
                (DELETED_ONLY only valid under CHANGED_BETWEEN), plus the
                matching objects/fields/filters/records/bulkCsvIds array for
                that type.
              properties:
                type: { type: string }
    EncryptedEnvelope:
      type: object
      required: [cipherText, iv, authTag]
      description: >
        AES-256-GCM payload, decryptable with the org's own encryption key
        (crm.encryptionKey). Used as both the request and response body on
        Salesforce envelope-authenticated routes — success and error bodies
        share this exact shape; the outcome is only visible after decrypting.
      properties:
        cipherText:
          type: string
        iv:
          type: string
        authTag:
          type: string

  responses:
    Success:
      description: Request succeeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Created:
      description: Resource created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    BadRequest:
      description: Validation error or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unauthorized:
      description: Missing, invalid or expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: Authenticated but not permitted to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: Record does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Encrypted:
      description: >
        Encrypted envelope (both success and error bodies use this same shape —
        decrypt to see the outcome, e.g. { success: true } or { errorCode }).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedEnvelope'
